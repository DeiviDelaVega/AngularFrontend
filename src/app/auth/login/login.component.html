<!-- src/app/auth/login/login.component.html -->
<nav class="navbar navbar-dark bg-dark px-3">
  <a class="navbar-brand text-white" routerLink="/">Web de Reservas</a>
</nav>

<div class="container py-5">
  <div class="row justify-content-center align-items-center">
    <div class="col-md-5">
      <h2>Inicio de sesión</h2>
      <form [formGroup]="form" (ngSubmit)="submit()">
        <div class="mb-3">
          <label>Correo electrónico</label>
          <input type="email" class="form-control" formControlName="email" placeholder="cliente@example.com"/>
        </div>
        <div class="mb-3">
          <label>Contraseña</label>
          <input type="password" class="form-control" formControlName="password" placeholder="Tu contraseña"/>
        </div>
        <div class="text-danger mb-2" *ngIf="error">{{error}}</div>
        <button class="btn btn-dark w-100">Iniciar sesión</button>
      </form>
      <div class="mt-3">
        ¿No tienes cuenta? <a routerLink="/auth/registro-cliente"><b>Regístrate aquí</b></a>
      </div>
    </div>
    <div class="col-md-5 d-none d-md-block">
      <img src="assets/imagenes/OIP.jpg" class="img-fluid" alt="Ilustración"/>
    </div>
  </div>
</div>
