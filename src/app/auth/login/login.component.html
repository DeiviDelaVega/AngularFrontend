<nav class=" navbar-dark custom-navbar">
  <a class="navbar-brand d-flex align-items-center" routerLink="/">
    <img src="assets/imagenes/nav_image.png" alt="Logo" width="40" height="40">
    <div>
      <span>Web de Reservas</span>
      <small>Monterrico Polo</small>
    </div>
  </a>
</nav>

<div class="container-fluid">
  <div class="row g-0 login-row">

    <div class="col-12 col-lg-4 d-flex align-items-center justify-content-center bg-white">
      <div class="login-box w-75">
        <h3 class="mb-4">Inicio de sesión</h3>
        <form [formGroup]="form" (ngSubmit)="submit()">

          <div class="mb-3">
            <label class="form-label">Correo electrónico</label>
            <input type="email" class="form-control" formControlName="email" placeholder="cliente@example.com" />
          </div>

          <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" class="form-control" formControlName="password" placeholder="Tu contraseña" />
          </div>

          <div class="mb-3">
            <label class="form-label">Captcha</label>
            <div class="d-flex align-items-center gap-2">
              <img *ngIf="captcha" [src]="captcha.imageBase64" alt="Captcha" class="border rounded" />
              <button type="button" class="btn btn-outline-secondary btn-sm" (click)="refreshCaptcha()"
                title="Actualizar captcha">
                <i class="bi bi-arrow-clockwise"></i>
              </button>
            </div>
            <input type="hidden" formControlName="captchaId" />
            <input class="form-control mt-2" formControlName="captchaCode"
              placeholder="Escribe el texto de la imagen" />
          </div>


          <div class="text-danger mb-2" *ngIf="error">{{ error }}</div>

          <button class="btn btn-dark w-100" [disabled]="loading || !captcha">
            {{ loading ? 'Ingresando…' : 'Iniciar sesión' }}
          </button>
        </form>

        <div class="mt-3 small">
          ¿No tienes cuenta?
          <a routerLink="/auth/registro-cliente"><b>Regístrate aquí</b></a>
        </div>
      </div>
    </div>

    <div class="col-12 col-lg-8 d-none d-lg-block p-0 login-right">
      <img src="assets/imagenes/fondoPolo.png" alt="Ilustración" class="login-img">
    </div>

  </div>
</div>
