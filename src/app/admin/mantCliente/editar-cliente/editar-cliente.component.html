
<app-header-admin></app-header-admin>
<br>
<h2 class="text-center section-title">
  ACTUALIZAR DATOS DEL CLIENTE CON ID {{ cliente.idCliente }}
</h2>
<div class="container mt-4" style="padding: 0 15px;">
  <div class="form-horizontal">
    <h4 class="text-center">Modificar información registrada</h4>
    <hr />
    <br />

    <form #clienteForm="ngForm" (ngSubmit)="actualizarCliente()" *ngIf="cliente">
      <input type="hidden" [(ngModel)]="cliente.idCliente" name="idCliente" />

      <div class="form-row">
        <div class="form-group col-md-6">
          <label class="control-label" for="nombre">Nombre</label>
          <input type="text" [(ngModel)]="cliente.nombre" name="nombre" class="form-control" required />
        </div>
        <div class="form-group col-md-6">
          <label class="control-label" for="apellido">Apellido</label>
          <input type="text" [(ngModel)]="cliente.apellido" name="apellido" class="form-control" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label class="control-label" for="nroDocumento">N° Documento</label>
          <input type="text" [(ngModel)]="cliente.nroDocumento" name="nroDocumento" class="form-control" required />
        </div>
        <div class="form-group col-md-6">
          <label class="control-label" for="direccion">Dirección</label>
          <input type="text" [(ngModel)]="cliente.direccion" name="direccion" class="form-control" required />
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label class="control-label" for="numeroTelf">Teléfono</label>
          <input type="text" [(ngModel)]="cliente.numeroTelf" name="numeroTelf" class="form-control" required />
        </div>
        <div class="form-group col-md-6">
          <label class="control-label" for="correo">Correo</label>
          <input type="email" [(ngModel)]="cliente.correo" name="correo" class="form-control" required />
        </div>
      </div>
      <div class="form-row">
        <div class="form-group col-md-6">
          <label for="estado" class="control-label">Estado</label>
          <select [(ngModel)]="cliente.estado" name="estado" class="form-control" id="estado" required>
            <option value="activo">Activo</option>
            <option value="sancionado">Sancionado</option>
          </select>
        </div>
        <div class="form-group col-md-6"></div>
      </div>

      <div class="button-group-container">
        <button type="submit" class="btn-dark" [disabled]="clienteForm.invalid">Actualizar</button>
        <div class="button-spacer"></div>

        <a [routerLink]="['/admin/clienteAdmin']" class="btn btn-secondary">Cancelar</a>
      </div>
    </form>
  </div>
</div>
