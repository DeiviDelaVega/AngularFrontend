<app-header-admin></app-header-admin>
<br>
<h2 class="text-center">
  ACTUALIZAR INMUEBLE CON ID {{ inmuebleId }}
</h2>

<div class="container mt-4">
  <div class="form-horizontal">
    <h4 class="text-center">Modificar información registrada</h4>
    <hr />

    <form [formGroup]="form" (ngSubmit)="confirmarActualizacion()" enctype="multipart/form-data">

      <div class="form-row">
        <div class="form-group col-md-6">
          <label class="control-label">Nombre</label>
          <input type="text" formControlName="nombre" class="form-control" placeholder="Nombre del inmueble" required>
        </div>

        <div class="form-group col-md-6">
          <label class="control-label">Capacidad</label>
          <input type="number" formControlName="capacidad" class="form-control" placeholder="Capacidad del inmueble" required>
        </div>
      </div>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label class="control-label">Número de Habitaciones</label>
          <input type="number" formControlName="numeroHabitaciones" class="form-control" placeholder="Número de habitaciones" required>
        </div>
        <div class="form-group col-md-6">
          <label class="control-label">Precio por Noche (S/.)</label>
          <input type="number" step="0.01" formControlName="precioPorNoche" class="form-control" placeholder="Precio por noche" required>
        </div>
      </div>

      <div class="form-group">
        <label class="control-label">Descripción</label>
        <textarea formControlName="descripcion" class="form-control1" rows="3" placeholder="Descripción del inmueble"></textarea>
      </div>

      <div class="form-row">
        <div class="form-group col-md-6">
          <label class="control-label">Servicios Incluidos</label>
          <input type="text" formControlName="serviciosIncluidos" class="form-control" placeholder="Servicios incluidos">
        </div>
        <div class="form-group col-md-6">
          <label class="control-label">Disponibilidad</label>
          <select formControlName="disponibilidad" class="form-control" required>
            <option value="Si">Si</option>
            <option value="No">No</option>
          </select>
        </div>
      </div>

      <div class="form-group col-md-12 text-center" style="margin-bottom:0px;">
        <label class="control-label">Imagen de Habitación</label>
        <div *ngIf="imagenActual">
          <img [src]="imagenActual" alt="Imagen actual" class="img-fluid mb-3 mt-2" style="max-height:400px; border-radius:10px;" (error)="imagenActual = null">
          <p><strong>Archivo actual:</strong>
            <span [style.text-decoration]="nombreArchivoNuevo ? 'line-through' : 'none'">
              {{ imagenActual.split('/').pop() }}
            </span>
          </p>
        </div>
        <div style="display: flex; justify-content: center; align-items: center; height: 100px;">
          <input type="file" class="form-control" (change)="onFileSelected($event)">
        </div>
        <p *ngIf="nombreArchivoNuevo" style="margin-top: 5px; color: green;">
          Nuevo archivo seleccionado: {{ nombreArchivoNuevo }}
        </p>
      </div>

      <input type="hidden" formControlName="latitud">
      <input type="hidden" formControlName="longitud">

      <div *ngIf="latitud && longitud" class="text-center">
        <label class="control-label">Ubicación en el Mapa</label>
        <div class="map-wrapper">
          <div id="map" style="height: 300px;"></div>
        </div>
      </div>
      <div class="text-center" *ngIf="!latitud || !longitud">
        <p><em>Este inmueble no tiene ubicación registrada</em></p>
      </div>

      <br>
      <div class="button-group-container mt-4">
        <button type="submit" class="btn btn-dark">Guardar</button>
        <button type="button" class="btn btn-secondary button-spacer" (click)="router.navigate(['/admin/inmuebles'])">Volver</button>
      </div>
    </form>
  </div>
</div>
